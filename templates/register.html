<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register Student</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            margin: 0;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }

    </style>

</head>


<body>

<header>

    <h1>Face Recognition Attendance System</h1>

    <nav>

        <a href="/">Home</a>

        <a href="/register">
            Register Student
        </a>

    </nav>

</header>


<div class="container">

    <div class="card">

        <h2>Register New Student</h2>

        <form method="POST"
              action="/register">

            <div class="form-group">

                <label for="student_id">
                    Student ID
                </label>

                <input
                    type="number"
                    id="student_id"
                    name="student_id"
                    placeholder="Enter student ID"
                    required
                >

            </div>


            <div class="form-group">

                <label for="name">
                    Student Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter student name"
                    required
                >

            </div>

            <div class="form-group">

                <label for="department">
                    Department / Branch
                </label>

                <input
                    type="text"
                    id="department"
                    name="department"
                    placeholder="e.g. Computer Science"
                    required
                >

            </div>

            <div class="form-group">

                <label for="year">
                    Current Year
                </label>

                <select
                    id="year"
                    name="year"
                    required
                    style="width: 100%; padding: 13px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; background: white;"
                >
                    <option value="">Select current year</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                </select>

            </div>

            <div class="form-group">

                <label for="subject">
                    Subject / Course
                </label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="e.g. Mathematics, Physics"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Student Login Password (optional)
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Set a password for student portal login"
                >

            </div>


            <button type="submit">
                Continue to Face Capture
            </button>

        </form>


        <a href="/" class="back">
            ← Back to Home
        </a>

    </div>

</div>

</body>

</html>
